name: Build PhotonX VST3 (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dependencies (whisper.cpp, demucs.cpp, vst3sdk)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git third_party/whisper.cpp
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/sevagh/demucs.cpp.git third_party/demucs.cpp
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git third_party/vst3sdk
          cd third_party/vst3sdk
          git submodule update --init --recursive --depth 1 base cmake pluginterfaces public.sdk vstgui4
          cd ../..

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release -j 4

      - name: Prepare VST3 Bundle Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/VST3/Release/PhotonX.vst3" "dist/PhotonX.vst3"

      - name: Upload PhotonX-Win64-VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotonX-Win64-VST3
          path: dist/
